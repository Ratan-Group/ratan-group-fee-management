const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function loginUser(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("message");
  msg.textContent="Logging in...";

  const {data,error}=await db.auth.signInWithPassword({email,password});

async function loadDashboard(userId){
  const {data:profile,error}=await db
    .from("user_profiles")
    .select("full_name,role,institution_id")
    .eq("user_id",userId)
    .single();

  if(error){

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("userName").textContent=profile.full_name;
  document.getElementById("userRole").textContent="Role: "+profile.role;

  const list=document.getElementById("institutionList");

  if(profile.role==="super_admin"){
    const {data:institutions,error:instError}=await db
      .from("institutions").select("name,code").order("name");
    if(instError){list.textContent=instError.message;return;}
    list.innerHTML="<h3>All Institutions</h3>";

      const div=document.createElement("div");
      div.className="item";
      div.textContent=item.name+" ("+item.code+")";

    });

    const {data:institution,error:instError}=await db
      .from("institutions").select("name,code")
      .eq("id",profile.institution_id).single();
    list.textContent=instError ? instError.message :
      "Institution: "+institution.name+" ("+institution.code+")";
  }
}

async function logoutUser(){

}

<script>
async function initStudentManagement() {
  const { data: profile, error } = await db
    .from('user_profiles')
    .select('institution_id, role')
    .eq('user_id', (await db.auth.getUser()).data.user.id)
    .single();

  if (error) {
    alert('Profile load error: ' + error.message);
    return;
  }

  window.studentProfile = profile;

  const instSelect = document.getElementById('stInstitution');
  const { data: institutions, error: instError } = await db
    .from('institutions')
    .select('id, name')
    .order('name');

  if (instError) {
    alert(instError.message);
    return;
  }

  instSelect.innerHTML = '';

  (institutions || []).forEach(item => {
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.name;
    instSelect.appendChild(option);
  });

  if (profile.role !== 'super_admin') {
    instSelect.value = profile.institution_id;
    instSelect.disabled = true;
  }

  await loadStudentSessions();
}

async function loadStudentSessions() {
  const institutionId = document.getElementById('stInstitution').value;
  const sessionSelect = document.getElementById('stSession');
  const classSelect = document.getElementById('stClass');

  sessionSelect.innerHTML = '<option value="">Loading sessions...</option>';
  classSelect.innerHTML = '<option value="">Select session first</option>';

  const { data, error } = await db
    .from('academic_sessions')
    .select('id, session_name')
    .eq('institution_id', institutionId)
    .order('session_name');

  if (error) {
    sessionSelect.innerHTML = '<option value="">Session error</option>';
    document.getElementById('studentMessage').textContent = error.message;
    return;
  }

  sessionSelect.innerHTML = '<option value="">Select Session</option>';

  (data || []).forEach(item => {
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.session_name;
    sessionSelect.appendChild(option);
  });
}

async function loadStudentClasses() {
  const institutionId = document.getElementById('stInstitution').value;
  const sessionId = document.getElementById('stSession').value;
  const classSelect = document.getElementById('stClass');

  const { data, error } = await db
    .from('classes_courses')

async function saveStudent() {
  const institutionId = document.getElementById('stInstitution').value;
  const sessionId = document.getElementById('stSession').value;
  const classId = document.getElementById('stClass').value;

  const student = {
    institution_id: institutionId,
    session_id: sessionId,
    class_course_id: classId,
    admission_no: document.getElementById('stAdmission').value.trim(),
    full_name: document.getElementById('stName').value.trim(),
    father_name: document.getElementById('stFather').value.trim(),
    mother_name: document.getElementById('stMother').value.trim() || null,
    mobile: document.getElementById('stMobile').value.trim(),
    guardian_mobile: document.getElementById('stGuardian').value.trim() || null,
    date_of_birth: document.getElementById('stDOB').value || null,
    gender: document.getElementById('stGender').value || null,
    roll_no: document.getElementById('stRoll').value.trim() || null,
    medium: document.getElementById('stMedium').value.trim() || null,
    address: document.getElementById('stAddress').value.trim(),
    transport_required: document.getElementById('stTransport').checked,
    bus_route: document.getElementById('stBus').value.trim() || null,
    previous_school: document.getElementById('stPrevious').value.trim() || null,
    admission_date: new Date().toISOString().slice(0, 10),
    active: true
  };

  if (!institutionId || !sessionId || !classId ||
      !student.admission_no || !student.full_name ||
      !student.father_name || !student.mobile) {
    alert('Institution, Session, Class, Admission No, Student Name, Father Name and Mobile are required.');
    return;

  const { error } = await db.from('students').insert(student);

  if (error) {
    alert('Student save error: ' + error.message);
    return;
  }

  alert('Student successfully saved!');
  document.getElementById('studentForm').reset();
  await loadStudents();
}

<script>
let studentInitialized = false;

async function initStudentManagement() {
  const msg = document.getElementById('studentMessage');
  msg.textContent = 'Loading...';

  const { data: authData, error: authError } = await db.auth.getUser();
  if (authError || !authData.user) {
    msg.textContent = 'Please login again.';
    return;
  }

  const { data: profile, error } = await db
    .from('user_profiles')
    .select('institution_id, role')
    .eq('user_id', authData.user.id)
    .single();

  if (error) {
    msg.textContent = 'Profile error: ' + error.message;
    return;
  }

  window.studentProfile = profile;

  const { data: institutions, error: instError } = await db
    .from('institutions')
    .select('*')
    .order('name');

  if (instError) {
    msg.textContent = 'Institution error: ' + instError.message;
    return;
  }

  const instSelect = document.getElementById('stInstitution');
  instSelect.innerHTML = '<option value="">Select Institution</option>';

  const isSuperAdmin = String(profile.role || '')
    .toLowerCase().includes('super');

  (institutions || []).forEach(item => {
    if (!isSuperAdmin && item.id !== profile.institution_id) return;

    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.name || item.institution_name || item.code || item.id;
    instSelect.appendChild(option);
  });

  if (!isSuperAdmin) {
    instSelect.value = profile.institution_id;
    instSelect.disabled = true;
  } else {
    instSelect.disabled = false;
  }

  studentInitialized = true;
  msg.textContent = 'Institution loaded successfully.';
  if (instSelect.value) await loadStudentSessions();
}

async function loadStudentSessions() {
  const institutionId = document.getElementById('stInstitution').value;
  const sessionSelect = document.getElementById('stSession');
  const classSelect = document.getElementById('stClass');

  sessionSelect.innerHTML = '<option value="">Select Session</option>';
  classSelect.innerHTML = '<option value="">Select Class / Course</option>';

  if (!institutionId) return;

  const { data, error } = await db
    .from('academic_sessions')
    .select('id, session_name')
    .eq('institution_id', institutionId)
    .order('session_name');

  if (error) {
    document.getElementById('studentMessage').textContent = error.message;
    return;
  }

  (data || []).forEach(item => {
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.session_name;
    sessionSelect.appendChild(option);
  });

  await loadStudentClasses();
}

async function loadStudentClasses() {
  const institutionId = document.getElementById('stInstitution').value;
  const classSelect = document.getElementById('stClass');

  classSelect.innerHTML = '<option value="">Select Class / Course</option>';
  if (!institutionId) return;

  const { data, error } = await db

    .eq('institution_id', institutionId)

    document.getElementById('studentMessage').textContent = error.message;

  }

  (data || []).forEach(item => {
    const option = document.createElement('option');
    option.value = item.id;

  });
}

async function showStudentManagement() {
  document.getElementById('studentManagement').style.display = 'block';
  document.getElementById('studentForm').style.display = 'none';

<script>
async function loadStudents() {
  const institutionId = document.getElementById('stInstitution').value;
  const search = document.getElementById('studentSearch').value.trim();
  const results = document.getElementById('studentResults');

  if (!institutionId) {
    results.textContent = 'Please select institution.';
    return;
  }

  let query = db.from('students')
    .select('id, admission_no, full_name, father_name, mobile, address, roll_no')
    .eq('institution_id', institutionId)
    .order('full_name');

  if (search) {
    query = query.or(
      'full_name.ilike.%' + search + '%,admission_no.ilike.%' +
      search + '%,mobile.ilike.%' + search + '%'
    );
  }

  const { data, error } = await query;
  results.innerHTML = '';

  if (error) {
    results.textContent = 'Error: ' + error.message;
    return;
  }

  const heading = document.createElement('h3');
  heading.textContent = 'Student List (' + data.length + ')';
  results.appendChild(heading);

  data.forEach(student => {
    const card = document.createElement('div');
    card.style.cssText =
      'background:white;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ddd;';

    const info = document.createElement('p');
    info.textContent =
      student.admission_no + ' | ' + student.full_name +
      ' | Father: ' + student.father_name +
      ' | Mobile: ' + student.mobile;

    const view = document.createElement('button');
    view.textContent = 'View';
    view.onclick = () => viewStudent(student);

    const edit = document.createElement('button');
    edit.textContent = 'Edit';
    edit.style.marginLeft = '6px';
    edit.onclick = () => editStudent(student);

    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.style.marginLeft = '6px';
    del.onclick = () => deleteStudent(student.id, student.full_name);

    card.append(info, view, edit, del);
    results.appendChild(card);
  });

  if (data.length === 0) {
    results.append('No students found.');
  }
}

function viewStudent(s) {
  alert(
    'Admission: ' + s.admission_no +
    '\nName: ' + s.full_name +
    '\nFather: ' + s.father_name +
    '\nMobile: ' + s.mobile +
    '\nRoll No: ' + (s.roll_no || '') +
    '\nAddress: ' + (s.address || '')
  );
}

async function editStudent(s) {
  const name = prompt('Student Name:', s.full_name);
  if (name === null) return;

  const father = prompt('Father Name:', s.father_name);
  if (father === null) return;

  const mobile = prompt('Mobile:', s.mobile);
  if (mobile === null) return;

  if (!name.trim() || !father.trim() || !mobile.trim()) {
    alert('Name, Father Name and Mobile are required.');
    return;
  }

  const { error } = await db.from('students')
    .update({
      full_name: name.trim(),
      father_name: father.trim(),
      mobile: mobile.trim()
    })
    .eq('id', s.id);

  if (error) {
    alert('Update Error: ' + error.message);
    return;
  }

  alert('Student updated successfully.');
  await loadStudents();
}

async function deleteStudent(id, name) {
  if (!confirm('Are you sure you want to delete ' + name + '?')) return;

  const { error } = await db.from('students')
    .delete()
    .eq('id', id);

  if (error) {
    alert('Delete Error: ' + error.message);
    return;
  }

  alert('Student deleted successfully.');
  await loadStudents();
}
</script>
