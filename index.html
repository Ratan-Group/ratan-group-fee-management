<script>

async function initStudentManagement() {
  const msg = document.getElementById('studentMessage');

  if (authError || !authData.user) {
    msg.textContent = 'Please login again.';
    return;
  }

  const { data: profile, error } = await db
    .from('user_profiles')
    .select('institution_id, role')

    return;

  window.studentProfile = profile;

    .from('institutions')

    msg.textContent = 'Institution error: ' + instError.message;
    return;

    instSelect.value = profile.institution_id;
    instSelect.disabled = true;
  } else {

<script>
async function loadStudents() {
  const institutionId = document.getElementById('stInstitution').value;
  const search = document.getElementById('studentSearch').value.trim();
  const results = document.getElementById('studentResults');

  if (!institutionId) {
    results.textContent = 'Please select institution.';
    return;
  }

  let query = db.from('students')
    .select('id, admission_no, full_name, father_name, mobile, address, roll_no')
    .eq('institution_id', institutionId)
    .order('full_name');

  if (search) {
    query = query.or(
      'full_name.ilike.%' + search + '%,admission_no.ilike.%' +
      search + '%,mobile.ilike.%' + search + '%'
    );
  }

  const { data, error } = await query;
  results.innerHTML = '';

  if (error) {
    results.textContent = 'Error: ' + error.message;
    return;
  }

  const heading = document.createElement('h3');
  heading.textContent = 'Student List (' + data.length + ')';
  results.appendChild(heading);

  data.forEach(student => {
    const card = document.createElement('div');
    card.style.cssText =
      'background:white;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ddd;';

    const info = document.createElement('p');
    info.textContent =
      student.admission_no + ' | ' + student.full_name +
      ' | Father: ' + student.father_name +
      ' | Mobile: ' + student.mobile;

    const view = document.createElement('button');
    view.textContent = 'View';
    view.onclick = () => viewStudent(student);

    const edit = document.createElement('button');
    edit.textContent = 'Edit';
    edit.style.marginLeft = '6px';
    edit.onclick = () => editStudent(student);

    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.style.marginLeft = '6px';
    del.onclick = () => deleteStudent(student.id, student.full_name);

    card.append(info, view, edit, del);
    results.appendChild(card);
  });

  if (data.length === 0) {
    results.append('No students found.');
  }
}

function viewStudent(s) {
  alert(
    'Admission: ' + s.admission_no +
    '\nName: ' + s.full_name +
    '\nFather: ' + s.father_name +
    '\nMobile: ' + s.mobile +
    '\nRoll No: ' + (s.roll_no || '') +
    '\nAddress: ' + (s.address || '')
  );
}

async function editStudent(s) {
  const name = prompt('Student Name:', s.full_name);
  if (name === null) return;

  const father = prompt('Father Name:', s.father_name);
  if (father === null) return;

  const mobile = prompt('Mobile:', s.mobile);
  if (mobile === null) return;

  if (!name.trim() || !father.trim() || !mobile.trim()) {
    alert('Name, Father Name and Mobile are required.');
    return;
  }

  const { error } = await db.from('students')
    .update({
      full_name: name.trim(),
      father_name: father.trim(),
      mobile: mobile.trim()
    })
    .eq('id', s.id);

  if (error) {
    alert('Update Error: ' + error.message);
    return;
  }

  alert('Student updated successfully.');
  await loadStudents();
}

async function deleteStudent(id, name) {
  if (!confirm('Are you sure you want to delete ' + name + '?')) return;

  const { error } = await db.from('students')
    .delete()
    .eq('id', id);

  if (error) {
    alert('Delete Error: ' + error.message);
    return;
  }

  alert('Student deleted successfully.');
  await loadStudents();
}
</script>

  const get = id => document.getElementById(id);
  const normalize = value =>
    String(value == null ? '' : value).trim().replace(/\s+/g, ' ').toLowerCase();

  function status(message) {
    get('feeImportStatus').textContent = message;
  }

  async function loadFeeImportOptions() {
    status('Loading institutions...');

    const { data: authData, error: authError } = await db.auth.getUser();

    if (authError || !authData.user) {
      status('Please login again.');
      return;
    }

    const { data: profile, error: profileError } = await db
      .from('user_profiles')
      .select('institution_id, role')
      .eq('user_id', authData.user.id)
      .single();

    if (profileError) {
      status('Profile error: ' + profileError.message);
      return;
    }

    const isSuperAdmin =
      String(profile.role || '').toLowerCase().includes('super');

    let institutionQuery = db
      .from('institutions')
      .select('id, name')
      .order('name');

    if (!isSuperAdmin) {
      institutionQuery = institutionQuery.eq('id', profile.institution_id);
    }

    const { data: institutions, error: institutionError } =
      await institutionQuery;

    if (institutionError) {
      status('Institution error: ' + institutionError.message);
      return;
    }

    const instSelect = get('feeImportInstitution');
    instSelect.innerHTML = '<option value="">Select Institution</option>';

    (institutions || []).forEach(item => {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = item.name;
      instSelect.appendChild(option);
    });

    if (!isSuperAdmin) {
      instSelect.value = profile.institution_id;
      instSelect.disabled = true;
    } else {
      instSelect.disabled = false;
    }

    if (instSelect.value) {
      await loadFeeImportSessions();
    } else {
      get('feeImportSession').innerHTML =
        '<option value="">Select Institution first</option>';
      status('Please select an institution.');
    }
  }

  async function loadFeeImportSessions() {
    const institutionId = get('feeImportInstitution').value;
    const sessionSelect = get('feeImportSession');

    sessionSelect.innerHTML = '<option value="">Loading...</option>';
    get('feePreviewButton').disabled = true;

    if (!institutionId) {
      sessionSelect.innerHTML =
        '<option value="">Select Institution first</option>';
      return;
    }

    const { data, error } = await db
      .from('academic_sessions')
      .select('id, session_name, active')
      .eq('institution_id', institutionId)
      .order('session_name');

    if (error) {
      sessionSelect.innerHTML =
        '<option value="">Session error</option>';
      status('Session error: ' + error.message);
      return;
    }

    sessionSelect.innerHTML = '<option value="">Select Session</option>';

    (data || []).forEach(item => {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = item.session_name;
      sessionSelect.appendChild(option);
    });

    const activeSessions = (data || []).filter(item => item.active);

    if (activeSessions.length === 1) {
      sessionSelect.value = activeSessions[0].id;
    }

    get('feePreviewButton').disabled = !sessionSelect.value;
    status('Institution and sessions loaded.');
  }

  async function previewFeeExcel() {
    try {
      if (typeof XLSX === 'undefined') {
        status('Excel library load nahi hui. Page refresh karke dobara try karein.');
        return;
      }

      const institutionId = get('feeImportInstitution').value;
      const sessionId = get('feeImportSession').value;
      const file = get('feeExcelFile').files[0];

      if (!institutionId || !sessionId) {
        status('Please select Institution and Academic Session.');
        return;
      }

      if (!file) {
        status('Please select Excel file.');
        return;
      }

      status('Reading Excel file...');

      const workbook = XLSX.read(await file.arrayBuffer());
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      if (!sheet) {
        status('Excel sheet not found.');
        return;
      }

      const excelRows = XLSX.utils.sheet_to_json(sheet, {
        defval: '',
        raw: false
      });

      if (!excelRows.length) {
        status('Excel file has no data.');
        return;
      }

      const requiredHeaders = [
        'Class / Course',
        'Fee Head',
        'Frequency',
        'Amount (₹)',
        'Academic Session'
      ];

      const missingHeaders = requiredHeaders.filter(
        header => !Object.prototype.hasOwnProperty.call(excelRows[0], header)
      );

      if (missingHeaders.length) {
        status('Wrong Excel format. Missing columns: ' + missingHeaders.join(', '));
        return;
      }

      const [{ data: classes, error: classError },
             { data: feeHeads, error: feeError }] = await Promise.all([
        db.from('classes_courses')
          .select('id, name')
          .eq('institution_id', institutionId),

        db.from('fee_heads')
          .select('id, name')
          .eq('institution_id', institutionId)
      ]);

      if (classError || feeError) {
        status('Database error: ' +
          (classError ? classError.message : feeError.message));
        return;
      }

      const classMap = new Map(
        (classes || []).map(item => [normalize(item.name), item.id])
      );

      const feeHeadMap = new Map(
        (feeHeads || []).map(item => [normalize(item.name), item.id])
      );

      const sessionOption = get('feeImportSession')
        .selectedOptions[0];

      const selectedSessionName = sessionOption.textContent.trim();

      const frequencyMap = {
        'monthly': 'Monthly',
        'quarterly': 'Quarterly',
        'half yearly': 'Half Yearly',
        'annual': 'Annual',
        'one time': 'One Time'
      };

      const validRows = [];
      const issues = [];
      const duplicateKeys = new Set();
      let blankAmountRows = 0;

      excelRows.forEach((row, index) => {
        const rowNumber = index + 2;
        const amountRaw = String(row['Amount (₹)'] || '').trim();

        if (!amountRaw) {
          blankAmountRows++;
          return;
        }

        const className = String(row['Class / Course'] || '').trim();
        const feeHeadName = String(row['Fee Head'] || '').trim();
        const frequencyInput = normalize(row['Frequency']);
        const sessionName = String(row['Academic Session'] || '').trim();

        const amountText = amountRaw.replace(/[₹,\s]/g, '');
        const amount = Number(amountText);

        if (!className || !feeHeadName || !frequencyInput) {
          issues.push('Row ' + rowNumber + ': Class, Fee Head or Frequency missing.');
          return;
        }

        if (!Number.isFinite(amount) || amount < 0) {
          issues.push('Row ' + rowNumber + ': Invalid Amount.');
          return;
        }

        if (sessionName &&
            normalize(sessionName) !== normalize(selectedSessionName)) {
          issues.push('Row ' + rowNumber + ': Academic Session does not match.');
          return;
        }

        const classId = classMap.get(normalize(className));
        if (!classId) {
          issues.push('Row ' + rowNumber + ': Class not found - ' + className);
          return;
        }

        const feeHeadId = feeHeadMap.get(normalize(feeHeadName));
        if (!feeHeadId) {
          issues.push('Row ' + rowNumber + ': Fee Head not found - ' + feeHeadName);
          return;
        }

        const frequency = frequencyMap[frequencyInput];
        if (!frequency) {
          issues.push('Row ' + rowNumber + ': Invalid Frequency.');
          return;
        }

        const key = classId + '|' + feeHeadId + '|' + frequency;

        if (duplicateKeys.has(key)) {
          issues.push('Row ' + rowNumber + ': Duplicate Class/Fee Head/Frequency.');
          return;
        }

        duplicateKeys.add(key);

        validRows.push({
          institution_id: institutionId,
          session_id: sessionId,
          class_course_id: classId,
          fee_head_id: feeHeadId,
          amount: amount,
          frequency: frequency,
          className: className,
          feeHeadName: feeHeadName
        });
      });

      pendingFeeRows = validRows;
      pendingContext = { institutionId, sessionId };

      const preview = get('feeImportPreview');
      preview.innerHTML = '';

      const summary = document.createElement('p');
      summary.textContent =
        'Valid rows: ' + validRows.length +
        ' | Blank rows skipped: ' + blankAmountRows +
        ' | Errors: ' + issues.length;
      preview.appendChild(summary);

      if (validRows.length) {
        const table = document.createElement('table');
        table.style.cssText =
          'width:100%;border-collapse:collapse;font-size:13px;';

        const headerRow = document.createElement('tr');

        ['Class', 'Fee Head', 'Frequency', 'Amount'].forEach(label => {
          const th = document.createElement('th');
          th.textContent = label;
          th.style.cssText = 'border:1px solid #ccc;padding:7px;';
          headerRow.appendChild(th);
        });

        table.appendChild(headerRow);

        validRows.slice(0, 15).forEach(item => {
          const tr = document.createElement('tr');

          [
            item.className,
            item.feeHeadName,
            item.frequency,
            '₹' + item.amount
          ].forEach(value => {
            const td = document.createElement('td');
            td.textContent = value;
            td.style.cssText = 'border:1px solid #ccc;padding:7px;';
            tr.appendChild(td);
          });

          table.appendChild(tr);
        });

        preview.appendChild(table);

        if (validRows.length > 15) {
          const more = document.createElement('p');
          more.textContent = 'Showing first 15 rows. Total valid rows: ' +
            validRows.length;
          preview.appendChild(more);
        }
      }

      if (issues.length) {
        const issueHeading = document.createElement('h4');
        issueHeading.textContent = 'Please check these rows:';
        preview.appendChild(issueHeading);

        const list = document.createElement('ul');

        issues.slice(0, 20).forEach(issue => {
          const li = document.createElement('li');
          li.textContent = issue;
          list.appendChild(li);
        });

        preview.appendChild(list);
      }

      get('feeImportButton').style.display =
        validRows.length ? 'inline-block' : 'none';

      status('Preview ready. Check the rows before importing.');

    } catch (error) {
      status('Preview error: ' + error.message);
    }
  }

  async function importFeePlans() {
    if (!pendingFeeRows.length || !pendingContext) {
      status('Please preview the Excel file first.');
      return;
    }

    if (get('feeImportInstitution').value !== pendingContext.institutionId ||
        get('feeImportSession').value !== pendingContext.sessionId) {
      status('Institution or Session changed. Please Preview Excel again.');
      return;
    }

    if (!confirm(
      'Import ' + pendingFeeRows.length +
      ' valid Fee Structure rows? Existing matching plans will be updated.'
    )) return;

    const importButton = get('feeImportButton');
    importButton.disabled = true;
    status('Importing Fee Structure...');

    let updatedCount = 0;
    let insertedCount = 0;

    try {
      const { data: existing, error: existingError } = await db
        .from('fee_plans')
        .select('id, class_course_id, fee_head_id, frequency')
        .eq('institution_id', pendingContext.institutionId)
        .eq('session_id', pendingContext.sessionId);

      if (existingError) {
        throw new Error(existingError.message);
      }

      const keyFor = item =>
        item.class_course_id + '|' +
        item.fee_head_id + '|' +
        normalize(item.frequency);

      const existingMap = new Map();

      (existing || []).forEach(item => {
        const key = keyFor(item);
        if (!existingMap.has(key)) {
          existingMap.set(key, item.id);
        }
      });

      const toUpdate = [];
      const toInsert = [];

      pendingFeeRows.forEach(item => {
        const key = keyFor(item);
        const existingId = existingMap.get(key);

        const record = {
          institution_id: item.institution_id,
          session_id: item.session_id,
          class_course_id: item.class_course_id,
          fee_head_id: item.fee_head_id,
          amount: item.amount,
          frequency: item.frequency
        };

        if (existingId) {
          toUpdate.push({ id: existingId, amount: item.amount });
        } else {
          toInsert.push(record);
        }
      });

      for (let i = 0; i < toUpdate.length; i += 10) {
        const batch = toUpdate.slice(i, i + 10);

        const results = await Promise.all(
          batch.map(item =>
            db.from('fee_plans')
              .update({ amount: item.amount })
              .eq('id', item.id)
          )
        );

        const failed = results.find(result => result.error);

        if (failed) throw new Error(failed.error.message);

        updatedCount += batch.length;
      }

      for (let i = 0; i < toInsert.length; i += 50) {
        const batch = toInsert.slice(i, i + 50);

        const { error } = await db.from('fee_plans').insert(batch);

        if (error) throw new Error(error.message);

        insertedCount += batch.length;
      }

      status(
        'Import successful! New plans: ' + insertedCount +
        ', Updated plans: ' + updatedCount
      );

      pendingFeeRows = [];
      pendingContext = null;
      get('feeExcelFile').value = '';
      get('feeImportButton').style.display = 'none';
      get('feeImportPreview').innerHTML = '';

    } catch (error) {
      status(
        'Import error: ' + error.message +
        '. Some earlier rows may already have been saved; check Fee Plans before retrying.'
      );
    } finally {
      importButton.disabled = false;
    }
  }

  get('feeLoadOptions').addEventListener('click', loadFeeImportOptions);
  get('feeImportInstitution').addEventListener('change', loadFeeImportSessions);

  get('feeImportSession').addEventListener('change', () => {
    get('feePreviewButton').disabled =
      !get('feeImportSession').value;
  });

  get('feePreviewButton').addEventListener('click', previewFeeExcel);
  get('feeImportButton').addEventListener('click', importFeePlans);

})();
            </script>
            
<script>
(function () {
  async function setupStudentFeeSettings() {
    const root = document.getElementById("studentManagement");
    if (!root) {
      setTimeout(setupStudentFeeSettings, 500);
      return;
    }

    if (document.getElementById("studentFeeSettingsPanel")) return;

    root.insertAdjacentHTML("beforeend", `
      <div style="margin-top:25px;padding:15px;border:1px solid #ccc;border-radius:10px">
        <h3>Student Fee Settings</h3>
        <button type="button" id="openStudentFeeSettings">
          विद्यार्थी की फीस सेटिंग खोलें
        </button>

        <div id="studentFeeSettingsArea" style="display:none;margin-top:15px">
          <label>Institution</label>
          <select id="sfsInstitution" style="width:100%;padding:10px;margin:5px 0"></select>

          <label>Academic Session</label>
          <select id="sfsSession" style="width:100%;padding:10px;margin:5px 0"></select>

          <label>Student</label>
          <select id="sfsStudent" style="width:100%;padding:10px;margin:5px 0"></select>

          <label>Fee Head</label>
          <select id="sfsFeeHead" style="width:100%;padding:10px;margin:5px 0"></select>

          <label>Payment Frequency</label>
          <select id="sfsFrequency" style="width:100%;padding:10px;margin:5px 0">
            <option value="Monthly">Monthly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="Half Yearly">Half Yearly</option>
            <option value="Annual">Annual</option>
            <option value="One Time">One Time</option>
          </select>

          <button type="button" id="saveStudentFeeSetting">
            Save Fee Setting
          </button>

          <p id="sfsMessage"></p>
          <h4>Saved Fee Settings</h4>
          <div id="sfsList"></div>
        </div>
      </div>
    `);

    const $ = id => document.getElementById(id);
    const msg = (text, color = "black") => {
      $("sfsMessage").textContent = text;
      $("sfsMessage").style.color = color;
    };

    let allowedInstitutionIds = [];

    $("openStudentFeeSettings").onclick = async () => {
      $("studentFeeSettingsArea").style.display = "block";
      await loadInstitutions();
    };

    $("sfsInstitution").onchange = loadSessions;
    $("sfsSession").onchange = loadStudents;
    $("sfsStudent").onchange = loadSavedSettings;

    async function loadInstitutions() {
      msg("Loading institutions...");
      const { data: authData, error: authError } =
        await db.auth.getUser();

      if (authError || !authData.user) {
        msg("Please login again.", "red");
        return;
      }

      const { data: profile, error: profileError } = await db
        .from("user_profiles")
        .select("role,institution_id")
        .eq("user_id", authData.user.id)
        .single();

      if (profileError || !profile) {
        msg("User profile nahi mila.", "red");
        return;
      }

      let query = db.from("institutions").select("id,name").order("name");

      if (!String(profile.role).toLowerCase().includes("super")) {
        query = query.eq("id", profile.institution_id);
      }

      const { data, error } = await query;

      if (error) {
        msg("Institution load error: " + error.message, "red");
        return;
      }

      allowedInstitutionIds = (data || []).map(x => x.id);
      $("sfsInstitution").innerHTML = (data || [])
        .map(x => `<option value="${x.id}">${x.name}</option>`)
        .join("");

      if (!data || !data.length) {
        msg("Koi institution nahi mila.", "red");
        return;
      }

      await loadSessions();
    }

    async function loadSessions() {
      const institutionId = $("sfsInstitution").value;
      if (!institutionId) return;

      const { data, error } = await db
        .from("academic_sessions")
        .select("id,session_name")
        .eq("institution_id", institutionId)
        .order("session_name", { ascending: false });

      if (error) {
        msg("Session error: " + error.message, "red");
        return;
      }

      $("sfsSession").innerHTML = (data || [])
        .map(x => `<option value="${x.id}">${x.session_name}</option>`)
        .join("");

      await loadStudents();
    }

    async function loadStudents() {
      const institutionId = $("sfsInstitution").value;
      const sessionId = $("sfsSession").value;
      if (!institutionId || !sessionId) return;

      const { data, error } = await db
        .from("students")
        .select("id,admission_no,full_name")
        .eq("institution_id", institutionId)
        .eq("session_id", sessionId)
        .eq("active", true)
        .order("full_name");

      if (error) {
        msg("Student error: " + error.message, "red");
        return;
      }

      $("sfsStudent").innerHTML =
        '<option value="">Select Student</option>' +
        (data || []).map(x =>
          `<option value="${x.id}">${x.admission_no || ""} - ${x.full_name}</option>`
        ).join("");

      const { data: heads, error: headError } = await db
        .from("fee_heads")
        .select("id,name")
        .eq("institution_id", institutionId)
        .order("name");

      if (headError) {
        msg("Fee Head error: " + headError.message, "red");
        return;
      }

      $("sfsFeeHead").innerHTML = (heads || [])
        .map(x => `<option value="${x.id}">${x.name}</option>`)
        .join("");

      $("sfsList").innerHTML = "";
      msg("Students and Fee Heads loaded.", "green");
    }

    async function loadSavedSettings() {
      const studentId = $("sfsStudent").value;
      const sessionId = $("sfsSession").value;
      if (!studentId || !sessionId) {
        $("sfsList").innerHTML = "";
        return;
      }

      const { data, error } = await db
        .from("student_fee_settings")
        .select("id,frequency,active,fee_heads(name)")
        .eq("student_id", studentId)
        .eq("session_id", sessionId)
        .order("created_at");

      if (error) {
        msg("Settings load error: " + error.message, "red");
        return;
      }

      $("sfsList").innerHTML = (data || []).map(x =>
        `<div style="padding:8px;border-bottom:1px solid #ddd">
          ${x.fee_heads?.name || "Fee"} — ${x.frequency}
          ${x.active ? " (Active)" : " (Inactive)"}
        </div>`
      ).join("") || "Abhi koi setting save nahi hai.";
    }

    $("saveStudentFeeSetting").onclick = async () => {
      const institutionId = $("sfsInstitution").value;
      const sessionId = $("sfsSession").value;
      const studentId = $("sfsStudent").value;
      const feeHeadId = $("sfsFeeHead").value;
      const frequency = $("sfsFrequency").value;

      if (!institutionId || !sessionId || !studentId || !feeHeadId) {
        msg("Institution, Session, Student aur Fee Head select karein.", "red");
        return;
      }

      if (!allowedInstitutionIds.includes(institutionId)) {
        msg("Institution access allowed nahi hai.", "red");
        return;
      }

      msg("Saving...");

      const { error } = await db
        .from("student_fee_settings")
        .upsert({
          institution_id: institutionId,
          session_id: sessionId,
          student_id: studentId,
          fee_head_id: feeHeadId,
          frequency: frequency,
          active: true
        }, {
          onConflict: "student_id,session_id,fee_head_id"
        });

      if (error) {
        msg("Save error: " + error.message, "red");
        return;
      }

      msg("Fee Setting Successfully Saved!", "green");
      await loadSavedSettings();
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupStudentFeeSettings);
  } else {
    setupStudentFeeSettings();
  }
})();
</script>

    const $ = id => document.getElementById(id);
    const msg = (s, color = "black") => {

    $("fgOpen").onclick = async () => {
      $("fgArea").style.display = "block";
      await loadInstitutions();

    $("fgInstitution").onchange = loadSessions;
    $("fgSession").onchange = loadStudentsAndClasses;
    $("fgType").onchange = () => {
      const bulk = $("fgType").value === "bulk";
      $("fgStudentBox").style.display = bulk ? "none" : "block";
      $("fgClassBox").style.display = bulk ? "block" : "none";

    async function loadInstitutions() {
      msg("Loading...");
      const { data: auth } = await db.auth.getUser();
      if (!auth?.user) return msg("Please login again.", "red");

      const { data: profile, error: pe } = await db
        .from("user_profiles")
        .select("role,institution_id")
        .eq("user_id", auth.user.id)
        .single();

      if (pe || !profile) return msg("Profile error: " + (pe?.message || ""), "red");

      let q = db.from("institutions").select("id,name").order("name");
      if (!String(profile.role).toLowerCase().includes("super")) {
        q = q.eq("id", profile.institution_id);

      await loadSessions();

    async function loadSessions() {
      const iid = $("fgInstitution").value;
      const { data, error } = await db.from("academic_sessions")
        .select("id,session_name,start_date,end_date")
        .eq("institution_id", iid)
        .order("start_date", { ascending: false });

      if (error) return msg("Session error: " + error.message, "red");

      $("fgSession").innerHTML = (data || []).map(x =>
        `<option value="${x.id}" data-start="${x.start_date}" data-end="${x.end_date}">
          ${x.session_name}
        </option>`
      ).join("");

      await loadStudentsAndClasses();
    }

    async function loadStudentsAndClasses() {
      const iid = $("fgInstitution").value;
      const sid = $("fgSession").value;
      if (!iid || !sid) return;

      const { data: students, error: se } = await db.from("students")
        .select("id,admission_no,full_name")
        .eq("institution_id", iid)
        .eq("session_id", sid)
        .eq("active", true)
        .order("full_name");

      if (se) return msg("Student error: " + se.message, "red");

      $("fgStudent").innerHTML = (students || []).map(s =>
        `<option value="${s.id}">${s.admission_no || ""} - ${s.full_name}</option>`
      ).join("");

      const { data: classes, error: ce } = await db.from("classes_courses")
        .select("id,name")
        .eq("institution_id", iid)
        .order("name");

      if (ce) return msg("Class error: " + ce.message, "red");

      $("fgClass").innerHTML = '<option value="">All Classes</option>' +
        (classes || []).map(c =>
          `<option value="${c.id}">${c.name}</option>`
        ).join("");

      msg("Students and Classes loaded.", "green");
    }

    function isoDate(d) {
      return d.toISOString().slice(0, 10);
    }

    function addMonths(date, months) {
      const d = new Date(date + "T00:00:00Z");
      const day = d.getUTCDate();
      d.setUTCDate(1);
      d.setUTCMonth(d.getUTCMonth() + months);
      const last = new Date(Date.UTC(
        d.getUTCFullYear(), d.getUTCMonth() + 1, 0
      )).getUTCDate();
      d.setUTCDate(Math.min(day, last));
      return d;
    }

    function makePeriods(start, end, frequency) {
      const months = {
        "Monthly": 1,
        "Quarterly": 3,
        "Half Yearly": 6,
        "Annual": 12
      };

      if (frequency === "One Time") {
        return [{ start, end, due: start }];
      }

      const step = months[frequency];
      if (!step) return [];

      const periods = [];
      let cursor = new Date(start + "T00:00:00Z");

      while (isoDate(cursor) <= end && periods.length < 24) {
        const next = addMonths(isoDate(cursor), step);
        const lastDay = new Date(next);
        lastDay.setUTCDate(lastDay.getUTCDate() - 1);

        const periodEnd = isoDate(lastDay) > end ? end : isoDate(lastDay);
        periods.push({
          start: isoDate(cursor),
          end: periodEnd,
          due: periodEnd
        });

        cursor = next;
      }
      return periods;
    }

    $("fgGenerate").onclick = async () => {
      const iid = $("fgInstitution").value;
      const sid = $("fgSession").value;
      const type = $("fgType").value;
      const studentId = $("fgStudent").value;
      const classId = $("fgClass").value;

      if (!iid || !sid) return msg("Institution aur Session select karein.", "red");
      if (type === "individual" && !studentId) return msg("Student select karein.", "red");

      const sessionOption = $("fgSession").selectedOptions[0];
      const start = sessionOption?.dataset.start;
      const end = sessionOption?.dataset.end;
      if (!start || !end) return msg("Session ki dates nahi mili.", "red");

      const confirmed = confirm(
        "Selected students ki Fee Due entries generate karni hain? Existing entries dobara nahi banengi."
      );
      if (!confirmed) return;

      $("fgGenerate").disabled = true;
      $("fgResults").innerHTML = "";
      msg("Fee generation chal rahi hai...");

      try {
        let sq = db.from("students")
          .select("id,full_name,admission_no,class_course_id")
          .eq("institution_id", iid)
          .eq("session_id", sid)
          .eq("active", true);

        if (type === "individual") sq = sq.eq("id", studentId);
        else if (classId) sq = sq.eq("class_course_id", classId);

        const { data: students, error: studentError } = await sq;
        if (studentError) throw studentError;
        if (!students?.length) throw new Error("Selected students nahi mile.");

        const studentIds = students.map(s => s.id);

        const { data: settings, error: settingsError } = await db
          .from("student_fee_settings")
          .select("student_id,fee_head_id,frequency")
          .eq("institution_id", iid)
          .eq("session_id", sid)
          .eq("active", true)
          .in("student_id", studentIds);

        if (settingsError) throw settingsError;
        if (!settings?.length) throw new Error("Students ki Fee Settings pehle save karein.");

        const classIds = [...new Set(students.map(s => s.class_course_id).filter(Boolean))];

        const { data: plans, error: planError } = await db
          .from("fee_plans")
          .select("id,class_course_id,fee_head_id,amount,frequency")
          .eq("institution_id", iid)
          .eq("session_id", sid)
          .in("class_course_id", classIds);

        if (planError) throw planError;

        const { data: existing, error: existingError } = await db
          .from("student_charges")
          .select("student_id,fee_head_id,period_start")
          .eq("institution_id", iid)
          .eq("session_id", sid)
          .in("student_id", studentIds);

        if (existingError) throw existingError;

        const existingKeys = new Set((existing || []).map(x =>
          `${x.student_id}|${x.fee_head_id}|${x.period_start}`
        ));

        const rows = [];
        let noPlan = 0;
        let already = 0;

        for (const student of students) {
          const studentSettings = settings.filter(x => x.student_id === student.id);

          for (const setting of studentSettings) {
            const plan = (plans || []).find(p =>
              p.class_course_id === student.class_course_id &&
              p.fee_head_id === setting.fee_head_id &&
              p.frequency === setting.frequency
            );

            if (!plan || Number(plan.amount) <= 0) {
              noPlan++;
              continue;
            }

            const periods = makePeriods(start, end, setting.frequency);

            for (const period of periods) {
              const key = `${student.id}|${setting.fee_head_id}|${period.start}`;

              if (existingKeys.has(key)) {
                already++;
                continue;
              }

              rows.push({
                institution_id: iid,
                student_id: student.id,
                fee_head_id: setting.fee_head_id,
                session_id: sid,
                fee_plan_id: plan.id,
                frequency: setting.frequency,
                period_start: period.start,
                period_end: period.end,
                due_date: period.due,
                description: `${setting.frequency} Fee (${period.start} to ${period.end})`,
                amount: Number(plan.amount)
              });

              existingKeys.add(key);
            }
          }
        }

        if (!rows.length) {
          msg(`New fees nahi bani. Already existing: ${already}, Fee Plan missing: ${noPlan}.`, "orange");
          return;
        }

        let inserted = 0;
        for (let i = 0; i < rows.length; i += 100) {
          const batch = rows.slice(i, i + 100);
          const { error } = await db.from("student_charges").insert(batch);
          if (error) throw new Error(
            `Save error: ${error.message}. Pehle ke kuch records save ho sakte hain.`
          );
          inserted += batch.length;
        }

        msg(
          `Success! New Fee Due: ${inserted} | Already Existing: ${already} | Fee Plan Missing: ${noPlan}`,
          "green"
        );

        $("fgResults").textContent =
          `Processed Students: ${students.length}. New Fee Due Entries: ${inserted}.`;
      } catch (e) {
        msg("Error: " + (e.message || e), "red");
      } finally {
        $("fgGenerate").disabled = false;
      }
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupFeeGeneration);
  } else {
    setupFeeGeneration();
  }
})();
</script>
<script>
(function () {
  async function setupFeeDueList() {
    const root = document.getElementById("studentManagement");
    if (!root) {
      setTimeout(setupFeeDueList, 500);
      return;
    }
    if (document.getElementById("feeDueListPanel")) return;

    root.insertAdjacentHTML("beforeend", `
      <div id="feeDueListPanel" style="margin-top:25px;padding:15px;border:1px solid #ccc;border-radius:10px">
        <h3>Student Fee Due List</h3>
        <button type="button" id="fdOpen">Open Fee Due List</button>

        <div id="fdArea" style="display:none;margin-top:15px">
          <label>Institution</label>
          <select id="fdInstitution" style="width:100%;padding:10px;margin:5px 0"></select>

          <label>Academic Session</label>
          <select id="fdSession" style="width:100%;padding:10px;margin:5px 0"></select>

          <label>Student (Optional)</label>
          <select id="fdStudent" style="width:100%;padding:10px;margin:5px 0">
            <option value="">All Students</option>
          </select>

          <button type="button" id="fdLoad">Show Fee Due</button>
          <p id="fdMessage"></p>
          <div id="fdSummary"></div>
          <div id="fdResults" style="overflow-x:auto"></div>
        </div>
      </div>
    `);

    const $ = id => document.getElementById(id);
    const msg = (s, color = "black") => {
      $("fdMessage").textContent = s;
      $("fdMessage").style.color = color;
    };

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function money(n) {
      return Number(n || 0).toLocaleString("en-IN", {
        maximumFractionDigits: 2
      });
    }

    $("fdOpen").onclick = async () => {
      $("fdArea").style.display = "block";
      await loadInstitutions();
    };

    $("fdInstitution").onchange = loadSessions;
    $("fdSession").onchange = loadStudents;
    $("fdLoad").onclick = loadDueList;

    async function loadInstitutions() {
      msg("Loading institutions...");
      const { data: auth } = await db.auth.getUser();
      if (!auth?.user) return msg("Please login again.", "red");

      const { data: profile, error: pe } = await db
        .from("user_profiles")
        .select("role,institution_id")
        .eq("user_id", auth.user.id)
        .single();

      if (pe || !profile) return msg("Profile error: " + (pe?.message || ""), "red");

      let q = db.from("institutions").select("id,name").order("name");
      if (!String(profile.role).toLowerCase().includes("super")) {
        q = q.eq("id", profile.institution_id);
      }

      const { data, error } = await q;
      if (error) return msg("Institution error: " + error.message, "red");

      $("fdInstitution").innerHTML = (data || [])
        .map(x => `<option value="${x.id}">${esc(x.name)}</option>`)
        .join("");

      if (!data?.length) return msg("Institution nahi mila.", "red");
      await loadSessions();
    }

    async function loadSessions() {
      const iid = $("fdInstitution").value;
      if (!iid) return;

      const { data, error } = await db
        .from("academic_sessions")
        .select("id,session_name")
        .eq("institution_id", iid)
        .order("session_name", { ascending: false });

      if (error) return msg("Session error: " + error.message, "red");

      $("fdSession").innerHTML = (data || [])
        .map(x => `<option value="${x.id}">${esc(x.session_name)}</option>`)
        .join("");

      await loadStudents();
    }

    async function loadStudents() {
      const iid = $("fdInstitution").value;
      const sid = $("fdSession").value;
      if (!iid || !sid) return;

      const { data, error } = await db.from("students")
        .select("id,admission_no,full_name")
        .eq("institution_id", iid)
        .eq("session_id", sid)
        .order("full_name");

      if (error) return msg("Student error: " + error.message, "red");

      $("fdStudent").innerHTML = '<option value="">All Students</option>' +
        (data || []).map(s =>
          `<option value="${s.id}">${esc(s.admission_no)} - ${esc(s.full_name)}</option>`
        ).join("");

      msg("Options loaded. Show Fee Due par click karein.", "green");
      $("fdResults").innerHTML = "";
      $("fdSummary").innerHTML = "";
    }

    async function loadDueList() {
      const iid = $("fdInstitution").value;
      const sid = $("fdSession").value;
      const selectedStudent = $("fdStudent").value;

      if (!iid || !sid) return msg("Institution aur Session select karein.", "red");

      $("fdLoad").disabled = true;
      msg("Fee Due List load ho rahi hai...");

      try {
        let q = db.from("student_charges")
          .select("id,student_id,fee_head_id,description,amount,due_date,frequency,period_start,period_end")
          .eq("institution_id", iid)
          .eq("session_id", sid)
          .order("due_date");

        if (selectedStudent) q = q.eq("student_id", selectedStudent);

        const { data: charges, error: chargeError } = await q;
        if (chargeError) throw chargeError;

        if (!charges?.length) {
          $("fdSummary").innerHTML = "";
          $("fdResults").innerHTML = "Is selection ke liye koi Fee Due record nahi mila.";
          return msg("No Fee Due records found.", "orange");
        }

        const studentIds = [...new Set(charges.map(x => x.student_id))];
        const headIds = [...new Set(charges.map(x => x.fee_head_id))];
        const chargeIds = charges.map(x => x.id);

        const [studentResult, headResult, allocationResult] = await Promise.all([
          db.from("students")
            .select("id,admission_no,full_name")
            .in("id", studentIds),

          db.from("fee_heads")
            .select("id,name")
            .in("id", headIds),

          db.from("payment_allocations")
            .select("charge_id,amount")
            .eq("institution_id", iid)
            .in("charge_id", chargeIds)
        ]);

        if (studentResult.error) throw studentResult.error;
        if (headResult.error) throw headResult.error;
        if (allocationResult.error) throw allocationResult.error;

        const studentMap = Object.fromEntries(
          (studentResult.data || []).map(x => [x.id, x])
        );
        const headMap = Object.fromEntries(
          (headResult.data || []).map(x => [x.id, x.name])
        );

        const paidMap = {};
        (allocationResult.data || []).forEach(x => {
          paidMap[x.charge_id] = (paidMap[x.charge_id] || 0) + Number(x.amount || 0);
        });

        let total = 0, paid = 0, balance = 0;

        const rows = charges.map((c, i) => {
          const student = studentMap[c.student_id] || {};
          const amount = Number(c.amount || 0);
          const paidAmount = paidMap[c.id] || 0;
          const remaining = Math.max(0, amount - paidAmount);

          total += amount;
          paid += paidAmount;
          balance += remaining;

          return `<tr>
            <td>${i + 1}</td>
            <td>${esc(student.admission_no || "")}</td>
            <td>${esc(student.full_name || "Unknown")}</td>
            <td>${esc(headMap[c.fee_head_id] || "Fee")}</td>
            <td>${esc(c.frequency || "")}</td>
            <td>${esc(c.description || "")}</td>
            <td>${esc(c.due_date || "")}</td>
            <td>₹${money(amount)}</td>
            <td>₹${money(paidAmount)}</td>
            <td><b>₹${money(remaining)}</b></td>
          </tr>`;
        }).join("");

        $("fdSummary").innerHTML = `
          <div style="padding:12px;background:#f1f5f9;border-radius:8px;margin:10px 0">
            <b>Total Fee:</b> ₹${money(total)} &nbsp; | &nbsp;
            <b>Paid:</b> ₹${money(paid)} &nbsp; | &nbsp;
            <b>Balance:</b> ₹${money(balance)}
          </div>`;

        $("fdResults").innerHTML = `
          <table border="1" cellpadding="7" cellspacing="0"
            style="border-collapse:collapse;width:100%;font-size:13px">
            <thead>
              <tr>
                <th>#</th><th>Admission No.</th><th>Student</th>
                <th>Fee Head</th><th>Frequency</th><th>Description</th>
                <th>Due Date</th><th>Total</th><th>Paid</th><th>Balance</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;

        msg(`Success! ${charges.length} Fee Due records loaded.`, "green");

      } catch (e) {
        msg("Error: " + (e.message || e), "red");
      } finally {
        $("fdLoad").disabled = false;
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupFeeDueList);
  } else {
    setupFeeDueList();
  }
})();
</script>

    async function loadInstitutions() {
      message("Loading institutions...");

      if (!auth?.user) return message("Please login again.", "red");

      const { data: profile, error: pe } = await db
        .from("user_profiles")

        .single();

      let q = db.from("institutions").select("id,name").order("name");
      if (!String(profile.role).toLowerCase().includes("super")) {

      const { data, error } = await q;
      if (error) return message("Institution error: " + error.message, "red");

      $("fcInstitution").innerHTML = (data || []).map(x =>

    async function loadSessions() {

        .eq("institution_id", iid)
        .order("session_name", { ascending: false });

      if (error) return message("Session error: " + error.message, "red");

      $("fcSession").innerHTML = (data || []).map(x =>
        `<option value="${x.id}">${esc(x.session_name)}</option>`
      ).join("");

      await loadStudents();
    }

    async function loadStudents() {
      const iid = $("fcInstitution").value;

      $("fcReceiptResult").innerHTML = "";

        const { data: charges, error: ce } = await db.from("student_charges")
          .select("id,fee_head_id,description,amount,due_date,frequency,period_start,period_end")
          .eq("institution_id", iid)
          .eq("session_id", sid)
          .eq("student_id", studentId)
          .order("due_date");

        if (ce) throw ce;

        if (!charges?.length) {

          $("fcDueList").innerHTML = "Is student ki koi Fee Due nahi hai.";
          $("fcDueSummary").innerHTML = "";
          return message("No outstanding fees found.", "orange");
        }

        const chargeIds = charges.map(x => x.id);
        const headIds = [...new Set(charges.map(x => x.fee_head_id))];

        const [allocResult, headResult] = await Promise.all([
          db.from("payment_allocations")
            .select("charge_id,amount")
            .eq("institution_id", iid)
            .in("charge_id", chargeIds),

          db.from("fee_heads")
            .select("id,name")
            .in("id", headIds)
        ]);

        if (allocResult.error) throw allocResult.error;
        if (headResult.error) throw headResult.error;

        const paidMap = {};
        (allocResult.data || []).forEach(x => {
          paidMap[x.charge_id] = (paidMap[x.charge_id] || 0) + Number(x.amount || 0);
        });

        const headMap = Object.fromEntries(
          (headResult.data || []).map(x => [x.id, x.name])
        );

        outstandingCharges = charges.map(c => ({
          ...c,
          feeHeadName: headMap[c.fee_head_id] || "Fee",
          paid: paidMap[c.id] || 0,
          balance: Math.max(0, Number(c.amount) - (paidMap[c.id] || 0))
        })).filter(c => c.balance > 0.001);

        const totalDue = outstandingCharges.reduce((sum, c) => sum + c.balance, 0);

        $("fcDueSummary").innerHTML = `
          <div style="padding:12px;background:#f1f5f9;border-radius:8px">
            <b>Total Outstanding:</b> ₹${money(totalDue)}
          </div>`;

        $("fcDueList").innerHTML = outstandingCharges.length ? `
          <table border="1" cellpadding="7" cellspacing="0"
            style="border-collapse:collapse;width:100%;font-size:13px">
            <tr>
              <th>Fee Head</th><th>Description</th><th>Due Date</th>
              <th>Total</th><th>Paid</th><th>Balance</th>
            </tr>
            ${outstandingCharges.map(c => `
              <tr>
                <td>${esc(c.feeHeadName)}</td>
                <td>${esc(c.description)}</td>
                <td>${esc(c.due_date)}</td>
                <td>₹${money(c.amount)}</td>
                <td>₹${money(c.paid)}</td>
                <td><b>₹${money(c.balance)}</b></td>
              </tr>
            `).join("")}
          </table>
        ` : "No outstanding balance.";

        $("fcCollect").disabled = !outstandingCharges.length;
        message("Outstanding fees loaded.", "green");

      } catch (e) {
        message("Error: " + (e.message || e), "red");
      }
    }

    $("fcCollect").onclick = async () => {
      const iid = $("fcInstitution").value;
      const studentId = $("fcStudent").value;
      const amount = Number($("fcAmount").value);
      const date = $("fcDate").value;
      const mode = $("fcMode").value;
      const reference = $("fcReference").value.trim() || null;
      const remarks = $("fcRemarks").value.trim() || null;

      const totalDue = outstandingCharges.reduce((sum, c) => sum + c.balance, 0);

      if (!studentId || !outstandingCharges.length) {
        return message("Pehle student ki Outstanding Fees load karein.", "red");
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        return message("Valid payment amount enter karein.", "red");
      }
      if (amount > totalDue + 0.001) {
        return message("Payment amount outstanding balance se zyada hai.", "red");
      }
      if (!date) return message("Payment date select karein.", "red");

      const student = studentsCache.find(s => s.id === studentId);
      if (!confirm(
        `Student: ${student?.full_name || ""}\nPayment: ₹${money(amount)}\nMode: ${mode}\n\nPayment confirm karein?`
      )) return;

      $("fcCollect").disabled = true;
      message("Payment save ho raha hai...");

      try {
        let remaining = amount;
        const allocations = [];

        for (const charge of outstandingCharges) {
          if (remaining <= 0.001) break;
          const part = Math.min(remaining, charge.balance);
          if (part > 0) {
            allocations.push({
              charge_id: charge.id,
              amount: Math.round(part * 100) / 100
            });
            remaining = Math.round((remaining - part) * 100) / 100;
          }
        }

        if (remaining > 0.001) {
          throw new Error("Payment allocation calculate nahi ho paya.");
        }

        const { data, error } = await db.rpc("collect_student_fee", {
          p_institution_id: iid,
          p_student_id: studentId,
          p_amount: amount,
          p_payment_date: date,
          p_payment_mode: mode,
          p_transaction_ref: reference,
          p_remarks: remarks,
          p_allocations: allocations
        });

        if (error) throw error;

        const result = Array.isArray(data) ? data[0] : data;
        if (!result?.receipt_no) throw new Error("Payment saved, but receipt number response nahi mila. Payment history check karein; dobara submit na karein.");

        $("fcAmount").value = "";
        $("fcReference").value = "";
        $("fcRemarks").value = "";

        $("fcReceiptResult").innerHTML = `
          <div style="margin-top:15px;padding:15px;border:2px solid #198754;border-radius:8px">
            <h3>Payment Successful</h3>
            <p><b>Receipt No:</b> ${esc(result.receipt_no)}</p>
            <p><b>Student:</b> ${esc(student?.full_name || "")}</p>
            <p><b>Admission No:</b> ${esc(student?.admission_no || "")}</p>
            <p><b>Amount Received:</b> ₹${money(amount)}</p>
            <p><b>Date:</b> ${esc(date)}</p>
            <p><b>Payment Mode:</b> ${esc(mode)}</p>
            <p>Payment record successfully saved.</p>
          </div>`;

        message("Payment successfully collected. Receipt No: " + result.receipt_no, "green");
        await loadOutstanding();

      } catch (e) {
        message("Payment error: " + (e.message || e), "red");
      } finally {
        $("fcCollect").disabled = false;
      }
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupFeeCollection);
  } else {
    setupFeeCollection();
  }
})();
</script>
